version: 0.2

env:
  parameter-store:
    API_KEY: /${CODE_PIPELINE_NAME}/API_KEY

phases:
  install:
    commands:
      - npm install

  build:
    commands:
      - test -n "$API_KEY" && echo "API_KEY is set"
      - chmod +x scripts/build.sh
      - ./scripts/build.sh

artifacts:
  files:
    - '**/*'
  base-directory: build